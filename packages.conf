# olecharms packages.conf — the shared package and plugin list
# This file is sourced by olecharms.sh and tracked in git. For additions that
# only apply to one machine, use ~/.config/olecharms/packages.local.conf
# (sourced right after this file; updates never touch it).

# System packages (Debian/Ubuntu apt). Search and file tools: ripgrep (rg),
# fd-find (fd), silversearcher-ag (ag), bat (cat with colours), git-delta
# (readable diffs), jq (JSON), tealdeer (tldr: short examples), zoxide (the j
# command; it replaces autojump and takes its folders over). Names a release
# does not have are skipped one by one.
APT_PACKAGES=( git vim curl zsh fontconfig fzf silversearcher-ag ripgrep fd-find bat git-delta jq tealdeer zoxide )

# System packages (macOS brew); mise only here: on Linux olecharms installs
# its release binary (checksum verified) into ~/.local/bin
BREW_PACKAGES=( git vim curl zsh fzf the_silver_searcher ripgrep fd bat git-delta jq tealdeer zoxide mise )

# Tools installed in your home, without root, when the system packages above
# did not provide them (no Homebrew, no sudo, or a name this release lacks):
#   "command|mise tool|npm package|install script URL"
# tried in that order, an empty field skipping that way. mise takes them from
# the projects' own releases (aqua registry, checksums verified); npm only
# official packages; an install script is downloaded to a file first and then
# run (never piped into a shell), without sudo. What none of these can install
# (git, vim, zsh, ag...) is reported at the end of install/update.
HOME_TOOLS=(
    "rg|aqua:BurntSushi/ripgrep||"
    "fd|aqua:sharkdp/fd||"
    "bat|aqua:sharkdp/bat||"
    "delta|aqua:dandavison/delta||"
    "jq|aqua:jqlang/jq||"
    "fzf|aqua:junegunn/fzf||"
    "zoxide|aqua:ajeetdsouza/zoxide||https://raw.githubusercontent.com/ajeetdsouza/zoxide/main/install.sh"
    "tldr|aqua:tealdeer-rs/tealdeer|tldr|"
)

# Vim plugins: "directory_name|git_url"
VIM_PLUGINS=(
    "airline|https://github.com/vim-airline/vim-airline.git"
    "ctrlp|https://github.com/ctrlpvim/ctrlp.vim.git"
    "easymotion|https://github.com/easymotion/vim-easymotion.git"
    "fugitive|https://github.com/tpope/vim-fugitive.git"
    "nerdtree|https://github.com/preservim/nerdtree.git"
    "supertab|https://github.com/ervandew/supertab.git"
    "surround|https://github.com/tpope/vim-surround.git"
    "syntastic|https://github.com/vim-syntastic/syntastic.git"
    "vim-go|https://github.com/fatih/vim-go.git"
)

# Pathogen URL
PATHOGEN_REPO="https://github.com/tpope/vim-pathogen.git"

# Powerline fonts URL + which families to install
POWERLINE_FONTS_REPO="https://github.com/powerline/fonts.git"
FONT_FAMILIES=( "DejaVuSansMono" )

# Custom commands to run after install/update (optional)
# POST_INSTALL_COMMANDS=( "echo done" )
